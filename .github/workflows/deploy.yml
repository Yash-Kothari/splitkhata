name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile app
        run: npm test -- --watchAll=false
        working-directory: mobile

      - name: Export mobile app for web
        run: npx expo export --platform web
        working-directory: mobile
        env:
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-dist
          cp -r mobile/dist/. pages-dist/
          # expo-router uses real client-side routes (/travel, /cards, ...),
          # but GitHub Pages has no server-side rewrites - a hard refresh or
          # direct link to any of them 404s without this. The standard GH
          # Pages SPA fallback: serve the app shell for any unmatched path
          # (as a 404 response, harmless) and let the client router take it
          # from there.
          cp pages-dist/index.html pages-dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
